services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: filitech
      POSTGRES_PASSWORD: filitech
      POSTGRES_DB: filitech_erp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filitech"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
